name: OmikujiCapsuleToy
version: '${version}'
api-version: '1.21.11'
description: omikuji capsuletoy.
author: kubotan
main: space.gorogoro.omikujicapsuletoy.OmikujiCapsuleToy

commands:
  omikujicapsuletoy:
    description: Commands to manage your event capsuletoy
    usage: |
      Use /help omikujicapsuletoy [subcommand] for more information
      /<command> list - List all capsuletoy
      /<command> modify <capsuletoy_name> - Modify a capsuletoy
      /<command> delete <capsuletoy_name> - Delete a capsuletoy
      /<command> ticket <player_name> - Issue a ticket
  omikujicapsuletoy list:
    description: List all capsuletoy
    usage: /<command> list
  omikujicapsuletoy modify:
    description: Modify a capsuletoy chest
    usage: /<command> modify <capsuletoy_name>
  omikujicapsuletoy delete:
    description: Delete a capsuletoy
    usage: /<command> delete <capsuletoy_name>
  omikujicapsuletoy ticket:
    description: Issue a ticket
    usage: /<command> ticket <player_name>
